<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Infrastructure Technologies — Secure Cities. Smart Future.</title>
<meta name="description" content="Zen Infrastructure Technologies is an early-stage initiative exploring human-centered infrastructure, community safety, responsible technology, and well-being.">
<style>
/* ===== THEME: edit colors here ===== */
:root{--bg:#050a14;--bg2:#0a1424;--green:#39ff88;--cyan:#22d3ee;--text:#f2f7ff;--muted:#9fb0c7;--card:rgba(14,26,46,.72);--line:rgba(120,170,220,.2);--amber:#fbbf24;--r:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,rgba(5,10,20,.55),var(--bg) 85%);z-index:-1}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}h2{font-size:clamp(1.7rem,4vw,2.5rem)}h3{font-size:1.15rem}
p{margin:0 0 1em;max-width:70ch}a{color:var(--cyan)}
.wrap{max-width:1120px;margin:auto;padding:0 20px}section{padding:84px 0}
.lead{color:var(--muted);font-size:1.08rem}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.btn{display:inline-block;font:600 .95rem inherit;font-family:inherit;padding:11px 20px;border-radius:10px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{background:var(--green);color:#03120a;box-shadow:0 0 18px rgba(57,255,136,.35)}
.btn.solid{background:var(--green);color:#03120a}.btn.alt{border-color:var(--cyan);color:var(--cyan)}.btn.alt:hover{background:var(--cyan);color:#021218;box-shadow:0 0 18px rgba(34,211,238,.35)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(6px);transition:.2s}
.card:hover{border-color:rgba(57,255,136,.5)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:99px;border:1px solid}
.COMPLETED{color:var(--green);border-color:var(--green)}.INPROGRESS{color:var(--cyan);border-color:var(--cyan)}.PLANNED{color:var(--amber);border-color:var(--amber)}.FUTURE{color:var(--muted);border-color:var(--muted)}
/* NAV */
header{position:sticky;top:0;z-index:50;background:rgba(5,10,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);text-decoration:none}
